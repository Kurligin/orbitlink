services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    # Наружу API не публикуется: интерфейс ходит к нему через nginx по
    # внутренней сети compose. Локальный порт оставлен для отладки и /docs.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - orbitlink-state:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/presets', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    # Интерфейс и прокси /api -> backend:8000. Единственная точка входа для жюри.
    # По умолчанию слушает только localhost: на сервере наружу его выпускает
    # системный обратный прокси (Caddy), а не сам контейнер.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  orbitlink-state:
